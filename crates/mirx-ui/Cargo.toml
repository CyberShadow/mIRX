[package]
name = "mirx-ui"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build/main.rs"

[[bin]]
name = "mirx-ui"
path = "src/main.rs"

[features]
# The automation harness: the WM_COPYDATA protocol that drives the GUI, its
# state dump, synthetic event loads, and the `--automation`,
# `--render-state`, `--frame-size` and `--self-test` launches. The Windows
# UI suites, the snapshot driver and the live lane need it; the release a
# user gets (`cargo build --release`, scripts/cross-build.sh) has none of
# it. The bin's unit tests always have it.
automation = []

# The suites that drive the GUI through the harness.
[[test]]
name = "automation_driver"
required-features = ["automation"]

[[test]]
name = "live"
required-features = ["automation"]

[[test]]
name = "mdi_child_reactivation"
required-features = ["automation"]

[[test]]
name = "scale"
required-features = ["automation"]

[[test]]
name = "verify_duplicate_navigation_labels"
required-features = ["automation"]

[dependencies]
mirx-core = { path = "../mirx-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
miniz_oxide = "0.8"

[dev-dependencies]
mirx-testkit = { path = "../mirx-testkit" }

# The live lane's peers (tests/live.rs, Windows only); the same matrix-sdk
# mirx-core builds.
[target.'cfg(windows)'.dev-dependencies]
matrix-sdk = { version = "=0.18.0", features = ["bundled-sqlite"] }
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["sync"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
