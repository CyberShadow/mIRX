[package]
name = "mmatrix-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
matrix-sdk = { version = "=0.18.0", features = ["bundled-sqlite"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
