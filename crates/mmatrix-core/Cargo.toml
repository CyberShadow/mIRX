[package]
name = "mmatrix-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
blake3 = { version = "=1.8.5", default-features = false, features = ["prefer_intrinsics"] }
matrix-sdk = { version = "=0.18.0", features = ["bundled-sqlite"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
