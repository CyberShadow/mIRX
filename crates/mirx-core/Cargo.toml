[package]
name = "mirx-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
blake3 = { version = "=1.8.5", default-features = false, features = ["prefer_intrinsics"] }
futures-util = "0.3"
matrix-sdk = { version = "=0.18.0", features = ["bundled-sqlite", "testing"] }
matrix-sdk-base = "=0.18.0"
matrix-sdk-crypto = "=0.18.0"
mime = "0.3"
# The Matrix HTML parser and sanitizer, the version matrix-sdk 0.18 locks.
ruma-html = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
url = "2"

[dev-dependencies]
matrix-sdk-test = "=0.18.0"
tempfile = "3"
wiremock = "=0.6.5"
