[workspace]
members = [
    "crates/mirx-core",
    "crates/mirx-testkit",
    "crates/mirx-ui",
]
# Third-party sources patched in below: built, but not linted or tested.
exclude = ["vendor"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Room key files derive their key with 500 000 rounds of PBKDF2-SHA512
# (the SDK fixes the count; Element reads the format). Unoptimized, an
# export or import takes ~10 s in test builds; optimized, ~0.3 s. The
# generic PBKDF2/HMAC code is instantiated in matrix-sdk-crypto, the
# compression function lives in sha2. Release builds optimize everything.
[profile.dev.package.matrix-sdk-crypto]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# A local copy of matrix-sdk 0.18.0 with a fix the next release will have:
# see vendor/matrix-sdk-0.18.0/VENDORED.md.
[patch.crates-io]
matrix-sdk = { path = "vendor/matrix-sdk-0.18.0" }
