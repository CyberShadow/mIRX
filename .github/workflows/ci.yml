name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # GitHub Actions workflow; keep it self-contained here and tune remote/cache settings later if needed.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix develop -c cargo fmt --check

      - name: Run clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: nix develop -c cargo test --workspace

      - name: Release cross-build
        run: nix develop -c ./scripts/cross-build.sh

      - name: Wine smoke self-test
        run: nix develop -c ./scripts/wine-smoke.sh

      - name: Wine automation driver test
        run: nix develop -c cargo test --target x86_64-pc-windows-gnu -p mmatrix-ui --test automation_driver

      - name: UI snapshot harness
        run: nix develop -c ./scripts/ui-snapshot.sh

      - name: DLL gate
        run: nix develop -c ./scripts/dll-gate.sh
